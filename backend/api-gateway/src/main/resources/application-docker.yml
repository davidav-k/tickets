spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/tickets}


  cloud:
    gateway:
      default-filters:
        - TokenRelay
      routes:
        - id: ticket-service
          uri: http://ticket-service:8091
          predicates:
            - Path=/api/tickets/**
          filters:
            - StripPrefix=1
