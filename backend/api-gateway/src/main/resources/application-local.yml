gateway:
  url: http://localhost:8088/api
  secret: ${GATEWAY_SECRET:gateway-secret-key}

spring:
  config:
    import: optional:file:../../.env
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/tickets}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/tickets}/protocol/openid-connect/certs
          jwk-set-cache: true

  cloud:
    gateway:
      routes:
        - id: ticket-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/tickets/**
          filters:
            - StripPrefix=1
            - name: SecurityContextRelay
              args:
                gatewaySecret: ${gateway.secret}
        - id: event-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/events/**
          filters:
            - StripPrefix=1
            - name: SecurityContextRelay
              args:
                gatewaySecret: ${gateway.secret}
        - id: hall-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/halls/**
          filters:
            - StripPrefix=1
            - name: SecurityContextRelay
              args:
                gatewaySecret: ${gateway.secret}
logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE
    org.springframework.boot.autoconfigure.security: TRACE